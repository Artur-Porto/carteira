name: data

# Downloads public market data every business-day night and publishes it with the app
# (SPEC, "Dados de mercado"). A failing source keeps its previous file: the run still
# publishes the others, and then fails so the problem shows up in the Actions tab. A source
# whose data is more than 5 business days old fails the run the same way.
on:
  schedule:
    # 22:17 in Brasília, Monday to Friday, off the full hour.
    - cron: '17 1 * * 2-6'
  workflow_dispatch:
    inputs:
      full:
        description: Baixar todas as séries desde o início
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
        working-directory: pipeline
      - id: update
        working-directory: pipeline
        continue-on-error: true
        run: node update.ts ${{ inputs.full && '--full' || '' }}
      - id: commit
        name: Commit the new data
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "Nada mudou."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Dados de mercado de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # A push made with the workflow's own token starts no other workflow, so the deploy,
      # which tests and publishes the site, is started here.
      - name: Publish
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fail when a source is late
        if: steps.update.outcome == 'failure'
        run: |
          echo "Alguma fonte falhou ou está com dado de mais de 5 dias úteis. Veja o resumo desta execução."
          exit 1
